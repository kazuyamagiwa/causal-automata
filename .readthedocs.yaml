# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Dependency resolution uses ``uv`` (``method: uv`` / ``command: pip``) so the
# docs environment matches GitHub Actions CI (``.github/workflows/test.yml``),
# which installs with ``uv pip install ".[cpu]"``.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    # Equivalent to CI: uv pip install ".[cpu]" (+ docs extras for Sphinx).
    # Only one ``method: uv`` entry is allowed under ``python.install``.
    - method: uv
      command: pip
      path: .
      extras:
        - docs
        - cpu
