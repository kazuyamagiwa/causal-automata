name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Run Synthetic Data Tests (CPU)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dependencies
        # Create a lightning-fast virtual environment and install into it
        run: |
          uv venv --clear
          uv pip install ".[cpu]" pytest

      - name: Run synthetic data tests
        # 'uv run' automatically executes pytest inside the virtual environment
        run: uv run pytest tests/
